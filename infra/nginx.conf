# Les fichiers compilés portent une empreinte ; les pages doivent rester actualisables.
map $uri $cache_policy {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/ "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Ces en-têtes restent présents aussi sur les fichiers compilés.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $cache_policy always;

    # Le nom du service reste valide après le remplacement du conteneur Node.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_address http://api:3083;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 11m;

    # Documents et vidéos circulent par flux, sans copie préalable dans Nginx.
    proxy_request_buffering off;
    proxy_buffering off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Seul le dépôt vidéo bénéficie de la limite et du délai étendus.
    location ~ ^/api/v1/teaching/courses/[^/]+/lessons/[^/]+/video$ {
        client_max_body_size 1025m;
        client_body_timeout 900s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass $api_address;
    }

    location /api/ {
        proxy_pass $api_address;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
