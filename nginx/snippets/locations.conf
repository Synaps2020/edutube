# Emplacements communs (HTTP ou HTTPS)
include /etc/nginx/snippets/security-headers.conf;
limit_conn perip 50;

# --- Médias statiques servis directement depuis le volume (HLS, audio, miniatures, waveforms, sous-titres)
# Les originaux, pièces jointes et fichiers temporaires ne sont JAMAIS exposés.
location ~ ^/media/(originals|submissions|tmp)/ { return 404; }
location ~ ^/media/(?<rel>.+\.m3u8)$ {
  alias /data/media/$rel;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=10" always;
  add_header Access-Control-Allow-Origin "*" always;
}
location ~ ^/media/(?<rel>.+\.(ts|m4a|mp4))$ {
  alias /data/media/$rel;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header Accept-Ranges bytes always;
}
location ~ ^/media/(?<rel>.+\.vtt)$ {
  alias /data/media/$rel;
  default_type "text/vtt; charset=utf-8";
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=86400" always;
}
location ~ ^/media/(?<rel>.+\.(jpg|jpeg|png|webp|json))$ {
  alias /data/media/$rel;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=86400" always;
}
location /media/ { return 404; }

# --- API : limite de débit, pas de cache, téléversements en flux
location /api/v1/auth/ {
  limit_req zone=auth burst=10 nodelay;
  proxy_pass http://app;
  include /etc/nginx/snippets/proxy.conf;
}
location /api/v1/metrics {
  allow 172.16.0.0/12; allow 10.0.0.0/8; allow 192.168.0.0/16; allow 127.0.0.1; deny all;
  proxy_pass http://app;
  include /etc/nginx/snippets/proxy.conf;
}
location /api/ {
  limit_req zone=api burst=60 nodelay;
  proxy_pass http://app;
  include /etc/nginx/snippets/proxy.conf;
  proxy_request_buffering off;
}

# --- Grafana (profil monitoring ; résolution différée car le service peut être absent)
location /grafana/ {
  resolver 127.0.0.11 valid=30s;
  set $grafana http://grafana:3000;
  rewrite ^/grafana/(.*)$ /$1 break;
  proxy_pass $grafana;
  include /etc/nginx/snippets/proxy.conf;
}

# --- Assets Next.js : cache long
location /_next/static/ {
  proxy_pass http://app;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# --- Application
location / {
  proxy_pass http://app;
  include /etc/nginx/snippets/proxy.conf;
}
