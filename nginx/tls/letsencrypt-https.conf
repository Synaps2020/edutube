server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;
  # Certificat obtenu avec : certbot certonly --webroot -w /var/www/certbot --cert-name default -d <domaine>
  ssl_certificate     /etc/nginx/certs/live/default/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/default/privkey.pem;
  include /etc/nginx/tls/ssl-params.conf;
  include /etc/nginx/snippets/locations.conf;
}
