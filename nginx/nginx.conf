# Nginx — reverse proxy, cache HLS, sécurité. Les fichiers de conf.d/ sont rendus par envsubst
# (SERVER_NAME, TLS_MODE) au démarrage du conteneur.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;   # contient m3u8 (application/vnd.apple.mpegurl) et ts (video/mp2t)
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time cache=$upstream_cache_status';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 2100m;        # téléversements administrateur (≥ MAX_UPLOAD_MB)
  client_body_timeout 600s;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/vnd.apple.mpegurl text/vtt image/svg+xml;
  gzip_min_length 1024;

  # Cache des segments HLS et miniatures (connexions limitées : les segments populaires sont servis depuis le cache disque)
  proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:50m max_size=10g inactive=7d use_temp_path=off;
  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 120s;

  # Limitation de débit réseau
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream app { server app:3000; keepalive 32; }

  include /etc/nginx/conf.d/*.conf;
}
